name: Bug report
description: Report something that went wrong while using AgentKit.
title: "[Bug] "
body:
  - type: input
    id: ue-version
    attributes:
      label: Unreal Engine version
      placeholder: "5.8"
    validations:
      required: true
  - type: input
    id: agentkit-version
    attributes:
      label: AgentKit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client or agent
      description: Include the name and version if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and prompt
      description: Describe the starting state and steps, including what you asked the agent.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the tool name and error if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: output-log
    attributes:
      label: Output Log excerpt
      description: Paste relevant messages and remove sensitive details.
      render: shell
